name: AERIS Portable Company CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout portable company repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile runtime
        run: python -m compileall aeris_runtime tests
      - name: Unit tests including privacy boundary
        run: python -m unittest discover -s tests -v
      - name: Validate 100-role company image
        run: python -m aeris_runtime company status
      - name: Build local-only knowledge database
        run: python -m aeris_runtime knowledge build
      - name: Detect CI machine profile
        run: python -m aeris_runtime machine detect --write
      - name: Verify mode switching
        shell: bash
        run: |
          for mode in offline local cloud auto; do
            python -m aeris_runtime mode set "$mode"
            test "$(python -m aeris_runtime mode show)" = "$mode"
          done
      - name: Doctor (limited without model server is allowed)
        shell: bash
        run: |
          set +e
          python -m aeris_runtime doctor
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          exit 0
