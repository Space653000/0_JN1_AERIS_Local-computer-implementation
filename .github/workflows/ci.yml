name: AERIS Portable Company CI

on:
  push:
    branches: [main, 'repair/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout portable company repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Compile runtime and Python tooling
        run: python -m compileall aeris_runtime tests scripts
      - name: Bash syntax checks
        if: runner.os == 'Linux'
        shell: bash
        run: bash -n INSTALL_AERIS_LOCAL.sh AERIS_AUTOPILOT.sh CLAUDE_VERIFY_AERIS.sh scripts/*.sh
      - name: PowerShell syntax checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -File *.ps1) + @(Get-ChildItem scripts -File -Filter *.ps1)
          $failed = $false
          foreach($file in $files) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count -gt 0) {
              $failed=$true
              Write-Host "PowerShell parse errors in $($file.FullName)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }
          if($failed){ throw 'PowerShell syntax validation failed.' }
      - name: Unit tests including Core alignment privacy trust acoustics and watchdog
        run: python -m unittest discover -s tests -v
      - name: Validate 100-role company image and maturity truth
        run: python -m aeris_runtime company status
      - name: Verify canonical Core has not drifted
        run: python scripts/check-core-drift.py
      - name: Build self-cleaning local-only knowledge database
        run: python -m aeris_runtime knowledge build
      - name: Detect CI machine profile
        run: python -m aeris_runtime machine detect --write
      - name: Verify mode switching
        shell: bash
        run: |
          for mode in offline local cloud auto; do
            python -m aeris_runtime mode set "$mode"
            test "$(python -m aeris_runtime mode show)" = "$mode"
          done
      - name: Doctor (limited without model server is allowed in CI only)
        shell: bash
        run: |
          set +e
          python -m aeris_runtime doctor
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          exit 0
      - name: Standalone release metadata smoke
        shell: bash
        run: |
          rm -rf .aeris/metadata-ci
          python scripts/release-metadata.py --root . --output .aeris/metadata-ci --source-commit "${{ github.sha }}"
          python -c "import json; json.load(open('.aeris/metadata-ci/SBOM.spdx.json')); json.load(open('.aeris/metadata-ci/PROVENANCE.json'))"
          test -s .aeris/metadata-ci/SHA256SUMS
      - name: Linux one-click installer smoke without external runtime installation
        if: runner.os == 'Linux'
        shell: bash
        run: AERIS_SKIP_CORE_SYNC=1 AERIS_SKIP_LOCAL_RUNTIME_INSTALL=1 bash ./INSTALL_AERIS_LOCAL.sh auto
      - name: Windows one-click installer smoke without external runtime installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./INSTALL_AERIS_LOCAL.ps1 -Mode auto -SkipLocalModelInstall -SkipCoreSync
      - name: Linux unattended operations smoke without OS persistence mutation
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/install-unattended-linux.sh --ci-smoke
      - name: Windows unattended operations smoke without OS persistence mutation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-unattended-windows.ps1 -CISmoke
      - name: Linux portable package smoke with SBOM/provenance and external digest
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rm -rf /tmp/aeris-dist /tmp/aeris-check
          bash scripts/package-company.sh /tmp/aeris-dist
          pkg="$(find /tmp/aeris-dist -maxdepth 1 -name 'AERIS-Portable-Company-*.tar.gz' -print -quit)"
          test -n "$pkg"
          test -s "$pkg.sha256"
          (cd "$(dirname "$pkg")" && sha256sum -c "$(basename "$pkg").sha256")
          mkdir -p /tmp/aeris-check
          tar -xzf "$pkg" -C /tmp/aeris-check
          test -s /tmp/aeris-check/release-metadata/SBOM.spdx.json
          test -s /tmp/aeris-check/release-metadata/PROVENANCE.json
          test -s /tmp/aeris-check/release-metadata/SHA256SUMS
      - name: Windows portable package smoke with SBOM/provenance and external digest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-company.ps1 -OutputDir dist-ci
          $pkg = Get-ChildItem dist-ci -Filter 'AERIS-Portable-Company-*.zip' | Select-Object -First 1
          if (-not $pkg) { throw 'Portable ZIP was not created.' }
          $sidecar = "$($pkg.FullName).sha256"
          if (-not (Test-Path $sidecar)) { throw 'Portable ZIP external SHA-256 sidecar was not created.' }
          $expected = ((Get-Content $sidecar -Raw).Trim().Split()[0]).ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $pkg.FullName).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Portable ZIP SHA-256 sidecar does not match package.' }
          $check = Join-Path $env:RUNNER_TEMP 'aeris-package-check'
          if (Test-Path $check) { Remove-Item $check -Recurse -Force }
          Expand-Archive $pkg.FullName -DestinationPath $check
          foreach($f in @('SBOM.spdx.json','PROVENANCE.json','SHA256SUMS')) {
            $p = Join-Path $check ("release-metadata\" + $f)
            if (-not (Test-Path $p)) { throw "Missing release metadata: $f" }
          }
