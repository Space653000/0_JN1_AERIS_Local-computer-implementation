<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#62c5ba"><title>AERIS — 帳號管理</title><link rel="stylesheet" href="/assets/aeris.css"><link rel="stylesheet" href="/assets/capabilities.css"><script src="/assets/aeris-theme.js"></script><script src="/assets/i18n.js"></script><script src="/assets/logout-button.js" defer></script></head><body data-page="admin">
<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">A</div><div class="brand-copy"><div class="brand-name">AERIS</div><div class="brand-sub">聲學工程作業系統</div></div></div><div class="sidebar-live"><span class="live-dot"></span><span id="sidebarState">連線中</span></div>
<div class="nav-group"><div class="nav-label">AERIS</div><nav class="nav"><a href="/dashboard"><span class="nav-icon">◎</span><span class="nav-copy"><b>儀表板</b><small>系統首頁</small></span></a><a href="/workspace"><span class="nav-icon">⌁</span><span class="nav-copy"><b>工作區</b><small>工程工作台</small></span></a><a href="/activity"><span class="nav-icon">↻</span><span class="nav-copy"><b>活動紀錄</b><small>可追溯稽核帳本</small></span></a><a href="/progress"><span class="nav-icon">▥</span><span class="nav-copy"><b>進度中心</b><small>P0-P6 真實進度</small></span></a><a href="/services"><span class="nav-icon">▣</span><span class="nav-copy"><b>服務</b><small>後端服務</small></span></a></nav></div>
<div class="nav-group"><div class="nav-label">系統</div><nav class="nav"><a class="active" href="/admin"><span class="nav-icon">◈</span><span class="nav-copy"><b>帳號管理</b><small>僅限擁有者</small></span></a></nav></div>
<div class="spacer"></div><div class="sidebar-note">只有擁有者帳號能新增、移除或調整其他帳號的權限範圍。</div></aside>
<main class="main"><div class="content">
<header class="topbar"><div><div class="page-title">帳號管理</div><div class="page-meta">新增、移除授權帳號，並設定各帳號可存取的頁面範圍</div></div><div class="actions"><button class="btn" id="refreshBtn">重新整理</button></div></header>
<div id="forbiddenNotice" class="notice" hidden><b>此頁僅限擁有者存取。</b> 你目前登入的帳號沒有管理其他帳號的權限。</div>

<section class="panel">
  <div class="section-title"><h2>目前帳號</h2><p id="userCount">載入中</p></div>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>帳號</th><th>角色</th><th>可存取頁面</th><th></th></tr></thead>
    <tbody id="userRows"><tr><td colspan="4">載入中</td></tr></tbody>
  </table></div>
</section>

<section class="panel" id="addUserPanel">
  <div class="section-title"><h2>新增授權帳號</h2><p>設定帳號密碼，並勾選這個帳號可以看到的頁面</p></div>
  <form id="addUserForm" class="formgrid">
    <div class="field"><label for="newUsername">帳號</label><input id="newUsername" type="text" required autocomplete="off"></div>
    <div class="field"><label for="newPassword">密碼（至少 8 碼）</label><input id="newPassword" type="password" required minlength="8" autocomplete="new-password"></div>
    <div class="field full">
      <label>可存取頁面</label>
      <div id="permissionChecks" class="pod"></div>
    </div>
    <div class="field full"><button class="btn primary" type="submit">新增帳號</button></div>
  </form>
  <div id="addUserError" class="notice" hidden></div>
</section>

</div></main></div>
<script src="/assets/admin.js"></script>
</body></html>
