<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AERIS — 進度中心</title><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/themes.css"></head><body><main id="mainContent"><header><div><div class="eyebrow">AERIS · 進度中心</div><h1>真實進度中心</h1><p>所有百分比來自本機 Runtime 與 Evidence；UNKNOWN 不會被猜成完成。</p></div><div class="status" role="status" aria-live="polite" id="state">載入中</div></header><section class="card"><div class="metrics" id="phases"></div><h2 id="overall">—</h2><p id="next">—</p><div id="blockers"></div></section><section class="card"><h2>P0–P6 細項（54 項）</h2><div id="items"></div></section><script>async function load(){const r=await fetch('/api/v1/progress',{cache:'no-store'}),d=await r.json();document.getElementById('state').textContent='已更新 '+new Date(d.generated_at_utc).toLocaleString('zh-TW');document.getElementById('overall').textContent='總體 '+d.overall_percent+'%';document.getElementById('next').textContent='下一步：'+d.next_action;document.getElementById('phases').innerHTML=Object.entries(d.phase_percent).map(([k,v])=>'<div class="card metric"><span>'+k+'</span><strong>'+v+'%</strong></div>').join('');document.getElementById('blockers').textContent=d.blockers.length?'阻礙項：'+d.blockers.join('、'):'阻礙項：無';document.getElementById('items').innerHTML=d.items.map(x=>'<div class="row"><b>'+x.id+'</b><span>'+x.state+' · '+x.percent+'%</span><small>'+(x.證據||'無 Evidence')+' · SHA '+(x.sha||'UNKNOWN')+'</small></div>').join('')}load();setInterval(load,10000);window.addEventListener('focus',load);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});</script></main></body></html>
