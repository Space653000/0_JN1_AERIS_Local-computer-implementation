[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeris-local-runtime"
version = "0.1.0"
description = "Local-first, offline-capable AERIS runtime with cloud/local AI switching"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aeris = "aeris_runtime.cli:main"

[tool.setuptools.packages.find]
include = ["aeris_runtime*"]
