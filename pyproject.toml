[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeris-portable-company"
version = "0.2.0"
description = "Portable, local-first, offline-capable AERIS company image with cloud/local AI switching"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aeris = "aeris_runtime.cli:main"

[tool.setuptools.packages.find]
include = ["aeris_runtime*"]
